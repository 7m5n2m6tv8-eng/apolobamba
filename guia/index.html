<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163e33">
<meta name="robots" content="noindex">
<title>Apolobamba · guia de ruta</title>
<style>
:root{--bg:#0e1916;--card:#16241f;--card2:#1e302a;--tx:#edf3ef;--mut:#a5b8b0;--ac:#6fc3a3;--warn:#ffb84d;--bad:#ff6b5b;--ok:#6fdc8c;--blue:#79b8ff;--line:#2c443c}
body.light{--bg:#f4f6f3;--card:#ffffff;--card2:#edf2ef;--tx:#122019;--mut:#4d5d56;--ac:#1c6b55;--warn:#a86400;--bad:#c62828;--ok:#1b7f3b;--blue:#1f4e8c;--line:#d3ddd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:16px;margin:0;flex:1;line-height:1.2;min-width:0}
header h1 small{display:block;color:var(--mut);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;text-align:right;line-height:1}
#clock+small{display:block;font-size:10px;color:var(--mut);text-align:right}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--card2);color:var(--tx);cursor:pointer;text-decoration:none;font-family:inherit}
.btn.ac{background:var(--ac);color:#06140e}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.on{outline:2px solid var(--ac)}
.btn:disabled{opacity:.5}
main{padding:12px 12px 96px;max-width:760px;margin:0 auto}
section{display:none}section.act{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.card h3{font-size:15px;margin:12px 0 4px}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mut{color:var(--mut)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--card2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);padding:8px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--ac);color:#06140e}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:7px 12px;font-weight:700;font-size:14px}
.chips button.pc{border-style:dashed}
.chips button.on{background:var(--ac);color:#06140e;border-color:var(--ac)}
.pt{border-left:4px solid var(--ac);padding-left:10px;margin:12px 0}
.pt.dec{border-color:var(--warn)}
.pt.done{opacity:.55}
.pt .hd,.hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.code{font-weight:800;background:var(--card2);border-radius:6px;padding:1px 7px;font-size:14px;white-space:nowrap}
.pt .nm{font-weight:700;flex:1;min-width:150px}
.times{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:14px;margin:4px 0}
.tram{font-size:13px;color:var(--mut);background:var(--card2);border-radius:8px;padding:6px 9px;margin:8px 0 2px}
details{margin-top:6px}summary{cursor:pointer;color:var(--blue);font-size:14px}
details.sf{border-bottom:1px solid var(--line);padding:4px 0 6px;margin:0}details.sf summary{color:var(--tx);font-weight:700;font-size:14px;padding:4px 0}
.alert{border-radius:12px;padding:12px 14px;margin:0 0 12px;font-weight:600}
.alert.bad{background:rgba(255,107,91,.15);border:1px solid var(--bad)}
.alert.warn{background:rgba(255,184,77,.13);border:1px solid var(--warn)}
.alert.ok{background:rgba(111,220,140,.12);border:1px solid var(--ok)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
tr.cur td{background:var(--card2)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 2px 10px;font-size:11px;font-weight:600}
nav button i{display:block;font-style:normal;font-size:20px;line-height:1.2}
nav button.on{color:var(--ac)}
nav button.sos{color:var(--bad)}
#mapwrap{position:relative;height:calc(100vh - 260px);min-height:320px;border-radius:12px;background:#e8e6df;overflow:hidden}
#mapcv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.maplegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin:6px 0 0}
.maplegend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.prog{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin:8px 0}.prog b{display:block;height:100%;background:var(--ac);width:0}
.met td,.met th{white-space:nowrap;padding:5px 4px}.met td.bad{background:rgba(255,107,91,.18)}.met td.warn{background:rgba(255,184,77,.16)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mapbar{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
svg.prof{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;font:10px system-ui,sans-serif}
svg.prof text{fill:var(--mut)}svg.prof .gl{stroke:var(--line)}svg.prof .pa{fill:var(--ac);fill-opacity:.15}svg.prof .pl{fill:none;stroke:var(--ac);stroke-width:1.8}
svg.prof .pp{fill:var(--card);stroke:var(--tx);stroke-width:1.5}svg.prof .pd{fill:var(--warn);stroke:var(--card);stroke-width:1.5}svg.prof .me{stroke:#1e88ff;stroke-width:2}
.chk label,#llistes label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.chk input,#llistes input{width:22px;height:22px;flex:none}
.call{display:block;text-align:center;background:var(--bad);color:#fff;font-size:20px;font-weight:800;padding:14px;border-radius:14px;text-decoration:none;margin-bottom:10px}
.calls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.calls a{display:block;text-align:center;background:var(--card2);color:var(--tx);border:1px solid var(--bad);border-radius:12px;padding:8px 4px;text-decoration:none;font-weight:800;font-size:18px}.calls a small{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.coord{font:700 20px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em;word-break:break-all}
.arrow{display:inline-block;font-size:28px;transition:transform .3s}
ul,ol{padding-left:18px;margin:6px 0}li{margin:3px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--warn);color:#1a1000;margin-left:4px}
.small{font-size:13px}
.fblk{margin:0 0 10px}.fblk+.fblk{border-top:1px solid var(--line);padding-top:10px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.g4>div{background:var(--card2);border-radius:10px;padding:6px 8px}
.g4 b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}.g4 span{font-size:11px;color:var(--mut)}
.fld{display:block;font-size:13px;color:var(--mut);margin:8px 0}.fld input{flex:1;min-width:0;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx)}
input[type=date],input[type=time]{font-size:16px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;padding:0;margin:8px 0;list-style:none;font-size:10px;text-align:center}
.months li{margin:0;padding:6px 0;border-radius:4px;background:var(--card2)}.months .m-best{background:var(--ok);color:#06140e;font-weight:700}.months .m-ok{background:rgba(111,220,140,.35)}.months .m-risk{background:rgba(255,184,77,.45)}.months .m-no{background:rgba(255,107,91,.3)}
.bars{list-style:none;padding:0;margin:6px 0}.bars li{display:grid;grid-template-columns:110px 1fr 46px 46px;gap:6px;align-items:center;font-size:12px;margin:4px 0}
.bars i{display:block;height:9px;border-radius:5px;background:var(--ac)}.bars b{text-align:right;font-variant-numeric:tabular-nums}.bars em{font-style:normal;color:var(--mut);text-align:right}.bars em.bad{color:var(--bad);font-weight:700}
a{color:var(--blue)}
.tri{display:inline-flex;gap:4px;margin:6px 0}.tri label{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-weight:700;font-size:14px;cursor:pointer;background:var(--card)}.tri input{display:none}.tri label.on.si{background:var(--ok);color:#06140e;border-color:var(--ok)}.tri label.on.no{background:var(--bad);color:#fff;border-color:var(--bad)}.tri label.on.na{background:var(--mut);color:#06140e}
.avi{border-bottom:1px solid var(--line);padding:8px 0}.avi input{width:100%;font-size:15px;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx)}
.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fld input{max-width:100%;box-sizing:border-box}.fld>input{width:100%;margin-top:4px}.fld textarea{width:100%;font-family:inherit;font-size:15px;line-height:1.4;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx);margin-top:4px}.fld input[type=date],.fld input[type=time],.fld input[type=number]{width:100%;margin-top:4px}
</style>

<link rel="icon" type="image/svg+xml" href="icon.svg">

<body>
<header>
  <h1><span data-t="hdrTitle">Apolobamba · guia de ruta</span><small id="hdrsub"></small></h1>
  <button class="btn sm" id="langBtn" aria-label="Idioma">CA</button>
  <div><div id="clock">--:--</div><small>BOT</small></div>
</header>
<main>

<!-- ============ ARA ============ -->
<section id="s-ara" class="act">
  <div class="chips" id="jornAra"></div>
  <div class="row" id="plaRow" style="margin:-4px 0 10px;gap:8px"><span class="small mut" data-t="plaLbl"></span><div class="seg" id="plaSeg" style="flex:1;margin:0"></div></div>
  <div id="alerts"></div>
  <div class="card">
    <h2 data-t="hLight"></h2>
    <div class="grid2">
      <div class="kv"><b id="safeLeft">--</b><span id="safeLbl"></span></div>
      <div class="kv"><b id="sunLeft">--</b><span id="sunLbl"></span></div>
    </div>
    <p class="small" id="llumA" style="margin:8px 0 0"></p>
  </div>
  <div class="card">
    <h2 data-t="hPos"></h2>
    <div class="row" style="margin-bottom:8px">
      <button class="btn ac gpsBtn"></button>
      <span class="mut small" id="gpsStat"></span>
      <button class="btn sm" id="wakeBtn"></button>
    </div>
    <div class="grid2">
      <div class="kv"><b id="kmDone">--</b><span data-t="kmDoneLbl"></span></div>
      <div class="kv"><b id="delay">--</b><span data-t="delayLbl"></span></div>
      <div class="kv"><b id="offTrack">--</b><span data-t="offLbl"></span></div>
      <div class="kv"><b id="eleNow">--</b><span data-t="eleLbl"></span></div>
    </div>
    <p class="mut small" style="margin:8px 0 0" data-t="noGpsHint"></p>
  </div>
  <div class="card" id="plaCard" style="display:none"><h2 data-t="hFollow"></h2><div id="plaBody"></div></div>
  <div class="card" id="nextCard"><h2 data-t="hNext"></h2><div id="nextBody" class="mut"></div></div>
  <div class="card" id="faltaCard"><h2 data-t="hFalta"></h2><div id="faltaBody" class="mut small"></div></div>
  <div class="card" id="decCard"><h2 data-t="hDec"></h2><div id="decBody"></div></div>
  <div class="card" id="metAra">
    <h2 data-t="hMeteo"></h2>
    <div id="metAraBody" class="mut small"></div>
    <div class="row" style="margin-top:8px"><button class="btn sm ac metBtn" data-t="metBtn"></button><span class="small mut" id="metAraAct"></span></div>
  </div>
  <div class="card" id="targetCard" style="display:none"><h2 data-t="hNav"></h2><div id="targetBody"></div></div>
</section>

<!-- ============ PUNTS ============ -->
<section id="s-punts">
  <div class="chips" id="jornPunts"></div>
  <div class="card" id="dayHead"></div>
  <div id="profile"></div>
  <div class="card" id="ptList" style="margin-top:12px"></div>
  <div class="card" id="ptPlanB"></div>
  <p class="small mut" data-t="ruleNote"></p>
</section>

<!-- ============ MAPA ============ -->
<section id="s-mapa">
  <div class="chips" id="jornMapa"></div>
  <div class="mapbar">
    <button class="btn sm" id="zIn" aria-label="+">＋</button><button class="btn sm" id="zOut" aria-label="−">−</button>
    <button class="btn sm" id="zMe" data-t="zMe"></button>
    <button class="btn sm" id="zDay" data-t="zDay"></button>
    <button class="btn sm" id="zAll" data-t="zAll"></button>
    <button class="btn sm" id="capaBtn"></button>
    <button class="btn sm" id="plansBtn"></button>
    <span class="mut small" id="mapStat"></span>
  </div>
  <div id="mapwrap"><canvas id="mapcv"></canvas></div>
  <div class="maplegend" data-t="legend"></div>
  <div class="card" style="margin-top:10px">
    <h2 data-t="hOffline"></h2>
    <div id="tilesStat" class="small"></div>
    <div class="prog"><b id="tilesProg"></b></div>
    <div class="row"><button class="btn ac sm" id="tilesBtn" data-t="tilesBtn"></button><button class="btn sm" id="tilesDel" data-t="tilesDel"></button></div>
    <p class="small mut" style="margin:8px 0 0" data-t="offlineNote"></p>
  </div>
  <p class="mut small" data-t="mapCredits"></p>
</section>

<!-- ============ PLANS ============ -->
<section id="s-plans">
  <div class="card"><h2 data-t="hQuefer"></h2><div id="quefer"></div></div>
  <div class="card"><h2 data-t="hEsquema"></h2><div id="esquema"></div></div>
  <div class="card"><h2 data-t="hPlansB"></h2><div id="plansB"></div></div>
  <div class="card"><h2 data-t="hPlanC"></h2><div id="planC"></div></div>
  <div class="card"><h2 data-t="hLlindars"></h2><div id="llindars"></div></div>
  <div class="card"><h2 data-t="hTrams"></h2><div id="trBC"></div><p class="mut small" data-t="tramsNote"></p></div>
</section>

<!-- ============ SOS ============ -->
<section id="s-sos">
  <div class="card" style="border-color:var(--bad)"><h2 class="bad" data-t="hSat"></h2><p class="small" data-t="satText"></p></div>
  <div class="calls"><a href="tel:110">110<small data-t="police"></small></a><a href="tel:165">165<small data-t="ambulance"></small></a><a href="tel:119">119<small data-t="fire"></small></a></div>
  <p class="small mut" data-t="callsNote"></p>
  <div class="card">
    <h2 data-t="hWhere"></h2>
    <div id="sosPos" class="mut"></div>
    <div class="row" style="margin-top:8px"><button class="btn sm gpsBtn"></button></div>
  </div>
  <div class="card"><h2 data-t="hProtocol"></h2><div id="protocol"></div></div>
  <div class="card"><h2 data-t="hContacts"></h2><div id="contactes"></div></div>
  <div class="card"><h2 data-t="hCoords"></h2><div id="coordTbl"></div></div>
</section>

<!-- ============ AVALUACIÓ ============ -->
<section id="s-aval">
  <button class="btn sm" id="avBack" style="margin-bottom:10px"></button>
  <div class="card" id="avBody"></div>
</section>

<!-- ============ INFO ============ -->
<section id="s-info">
  <div class="card" id="avalCard"></div>
  <div class="card"><h2 data-t="hGroup"></h2><div id="grup" class="small"></div></div>
  <div class="card"><h2 data-t="hHorari"></h2><div id="horari"></div></div>
  <div class="card" id="metCard"><h2 data-t="hMetPts"></h2>
    <div class="seg" id="metDia"></div>
    <div class="row" style="margin-bottom:8px"><button class="btn sm ac metBtn" data-t="metBtn"></button><span class="small mut" id="metAct"></span></div>
    <div id="metBody" class="small mut"></div>
    <p class="small mut" style="margin:8px 0 0" data-t="metNote"></p>
  </div>
  <div class="card"><h2 data-t="hMetFonts"></h2><div id="meteoFonts"></div></div>
  <div class="card"><h2 data-t="hSeason"></h2><div id="temporada"></div></div>
  <div class="card"><h2 data-t="hRoads"></h2><div id="carreteres"></div></div>
  <div class="card"><h2 data-t="hNights"></h2><div id="nits"></div></div>
  <div class="card"><h2 data-t="hChecks"></h2><div id="llistes"></div><button class="btn sm" id="resetChk" style="margin-top:8px" data-t="resetChk"></button></div>
  <div class="card"><h2 data-t="hGpx"></h2>
    <p class="small" data-t="gpxText"></p>
    <div class="row"><button class="btn sm ac" id="gpxBtn" data-t="gpxAll"></button><a class="btn sm" href="../dossiers/gpx/Apolobamba_Ruta_Principal.gpx" download data-t="gpxMain"></a></div>
  </div>
  <div class="card"><h2 data-t="hSettings"></h2>
    <div class="seg" id="langSeg"><button data-lang="ca">Català</button><button data-lang="es">Castellano</button><button data-lang="en">English</button><button data-lang="fr">Français</button></div>
    <div class="row">
      <button class="btn sm" id="themeBtn" data-t="themeBtn"></button>
      <button class="btn sm" id="resetBtn" data-t="resetBtn"></button>
    </div>
    <h3 data-t="startDate"></h3>
    <div class="row"><input type="date" id="inici"><span class="small mut" data-t="startHint"></span></div>
    <h3 data-t="simTitle"></h3>
    <p class="small mut" data-t="simHint"></p>
    <div class="row"><input type="time" id="simTime"><button class="btn sm" id="simOn" data-t="simOn"></button><button class="btn sm" id="simOff" data-t="simOff"></button></div>
    <h3 data-t="installTitle"></h3>
    <p class="small mut" data-t="installText"></p>
    <p class="small mut" id="verTxt"></p>
    <p class="small mut" data-t="credits"></p>
  </div>
</section>
</main>

<nav id="nav">
  <button data-s="ara" class="on"><i>⏱</i><span data-t="navAra"></span></button>
  <button data-s="punts"><i>📍</i><span data-t="navPunts"></span></button>
  <button data-s="mapa"><i>🗺</i><span data-t="navMapa"></span></button>
  <button data-s="plans"><i>🔀</i><span data-t="navPlans"></span></button>
  <button data-s="sos" class="sos"><i>✚</i>SOS</button>
  <button data-s="info"><i>ℹ</i><span data-t="navInfo"></span></button>
</nav>

<script>
// ---------------- INIT ----------------
if (store.get('light', false)) document.body.classList.add('light');
aplicaIdioma(); renderStatic(); pintaSelectors(); pintaWake(); renderSos();
mapa.init(); meteo.init(); pla.init(); aval.init(); renderPunts(); tick(); setInterval(tick, 15000);
{ const q = new URLSearchParams(location.search).get('aval'); if (['check', 'auto', 'enq'].includes(q)) aval.obre(q); } // enllaç directe des de la pàgina del treball
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) mostraNova(); }); });
  }).catch(() => {});
  function mostraNova() {
    if (document.getElementById('nova')) return; const d = document.createElement('div'); d.id = 'nova'; d.className = 'alert ok';
    d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:76px;z-index:40;display:flex;gap:10px;align-items:center';
    d.innerHTML = `<span style="flex:1">${T('newVersion')}</span><button class="btn sm ac">${T('update')}</button>`;
    d.querySelector('button').onclick = () => location.reload(); document.body.appendChild(d);
  }
}
</script>
